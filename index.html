<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Финансы — макет приложения</title>
<style>
/* Фон «Графит» и свечение «Пульс баланса» — слои под всем интерфейсом */
.bgl{position:fixed;inset:0;z-index:0;pointer-events:none}
#graphite{background:radial-gradient(ellipse 90% 30% at 50% 108%,rgba(255,255,255,.05),transparent 70%),radial-gradient(ellipse 120% 45% at 50% -8%,rgba(124,140,255,.28),transparent 70%),linear-gradient(180deg,#0D0E13 0%,#08080B 100%);transition:opacity .6s}
#pulse{background:#09090C;opacity:0;transition:opacity .6s}
#pulse i{position:absolute;inset:0;opacity:0;transition:opacity .6s}
#pulse .p-red{background:radial-gradient(ellipse 120% 55% at 50% 0%,rgba(240,98,95,.55),transparent 70%),radial-gradient(ellipse 130% 45% at 50% 100%,rgba(240,98,95,.55),transparent 70%)}
#pulse .p-green{background:radial-gradient(ellipse 120% 55% at 50% 0%,rgba(92,196,138,.5),transparent 70%),radial-gradient(ellipse 130% 45% at 50% 100%,rgba(92,196,138,.5),transparent 70%)}
#pulse b{position:absolute;inset:0;animation:breathe 4s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#pulse b{animation:none;opacity:1}}
body[data-pulse="neg"] #pulse,body[data-pulse="pos"] #pulse{opacity:1}
body[data-pulse="neg"] #graphite,body[data-pulse="pos"] #graphite{opacity:0}
body[data-pulse="neg"] #pulse .p-red,body[data-pulse="pos"] #pulse .p-green{opacity:1}
main{position:relative;z-index:1;padding-bottom:160px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tabs{background:rgba(14,15,22,.86) !important;backdrop-filter:blur(20px) !important;-webkit-backdrop-filter:blur(20px) !important;z-index:10}
.switch{position:relative;flex:none;width:46px;height:28px;border-radius:99px;background:var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{left:21px}
/* Схема: все суммы в долларах, в формате «число $». Категория — значок в кружке. Тег принадлежит категории: выбирается при записи операции, создаётся в карточке категории. Отчёт: категория раскрывается и показывает свои теги; фильтр по тегам — отдельно. */
:root{--bg:#06050a;--card:rgba(23,26,33,.86);--line:#262b36;--text:#eef1f6;--muted:#8a93a6;--green:#34c77b;--red:#ff6b6b;--accent:#6c8cff;--on-accent:#0f1115;--chip:#1f2430;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#eef1f6;--muted:#8a93a6;--green:#34c77b;--red:#ff6b6b;--accent:#6c8cff;--on-accent:#0f1115;--chip:#1f2430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#eef1f6;--muted:#8a93a6;--green:#34c77b;--red:#ff6b6b;--accent:#6c8cff;--on-accent:#0f1115;--chip:#1f2430;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#08080B;color:var(--text);font:15px/1.4 -apple-system,system-ui,"SF Pro Text",sans-serif}
body{padding-block:0 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:420px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
header{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 4px}
.gear{font-size:22px;width:40px;height:40px;border-radius:12px;text-align:center}
.gear[aria-current="page"]{background:var(--chip)}
.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.periods.short{grid-template-columns:repeat(2,1fr);width:66%;margin:0 auto}
.periods button{padding:13px 0;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500;text-align:center}
.periods button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.picker{margin:16px 0 14px;text-align:center}
.picker-btn{display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:600;padding:6px 10px;border-radius:10px}
.picker-btn:hover{background:var(--chip)}
.picker-btn small{font-size:14px;color:var(--accent);font-weight:500}
.picker-static{font-size:22px;font-weight:600;padding:6px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.list{padding:4px 14px}
.center{text-align:center}
small,.muted{color:var(--muted);font-size:13px;display:block}
.balance b{font-size:32px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .card{margin:0;text-align:center}
.row2 b{font-size:20px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
h3{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day{display:flex;justify-content:space-between;margin:14px 4px 6px;color:var(--muted);font-size:14px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.op:last-child{border-bottom:0}
.op-main{flex:1;min-width:0;display:flex;flex-direction:column}
.op-main b{font-weight:500}
.op-sum{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.op-sum small{font-weight:400}
.op-edit{color:var(--muted)}
.ico{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ico svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:20px;height:20px;margin-right:8px}
.ico.sm svg{width:11px;height:11px;stroke-width:1.6}
/* строка категории в отчёте: значок, название, %, сумма, стрелка */
.crow{display:grid;grid-template-columns:30px minmax(0,1fr) 44px 96px 16px;gap:10px;align-items:center;width:100%;padding:9px 12px;font-variant-numeric:tabular-nums}
.crow.home{grid-template-columns:30px minmax(0,1fr) 96px 32px}
.crow.home .chev{padding:10px 0;margin:-10px 0}
.catops{background:var(--chip);padding:2px 4px}
.catops .op{border-bottom:1px solid var(--line)}
.catops .op:last-child{border-bottom:0}
.crow .pct{color:var(--muted);font-size:14px;text-align:right}
.crow .sum{font-weight:600;text-align:right;white-space:nowrap}
.crow .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .chev{color:var(--muted);font-size:12px;text-align:center}
.crow .chev.open{color:var(--accent)}
.crow-wrap{border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}
.crow-wrap .track{height:4px;margin:0 14px 10px;border-radius:99px;background:var(--line);overflow:hidden}
.crow-wrap .track div{height:100%}
.tagrows{background:var(--chip);padding:4px 14px 6px}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) 96px;gap:8px;align-items:center;padding:9px 0;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .hash{color:var(--muted);font-size:17px;text-align:center}
.trow .tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tsum{text-align:right;white-space:nowrap}
.btn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);font-weight:500;padding:10px 4px}
.btn.danger{background:var(--red);color:#fff}
.btn.wide{display:block;width:100%;margin:10px 0;text-align:center;padding:14px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:10px}
.chart{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:20px;gap:2px;text-align:center}
.tabs button small{font-size:11px}
.tabs button[aria-current="page"] small{color:var(--accent)}
.tabs .fab{flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;justify-content:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet[hidden]{display:none}
.panel{width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sheet-head h2{font-size:18px;margin:0;text-align:center}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);margin-bottom:12px}
.amt{display:grid;grid-template-columns:1fr auto;gap:8px}
.amt select{width:112px}
.hint{font-size:13px;color:var(--muted);margin:-4px 4px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{padding:14px 0;border-radius:12px;background:var(--chip);font-weight:500;text-align:center}
.grid button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.nav{width:40px;height:36px;font-size:24px;border-radius:10px;background:var(--chip);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:4px 0}
.cal button{padding:10px 0;border-radius:10px;text-align:center;font-variant-numeric:tabular-nums}
.cal button[aria-current="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.icons button{display:flex;justify-content:center;padding:8px 0;border-radius:14px;border:2px solid transparent}
.icons button[aria-current="true"]{border-color:var(--accent)}
.taglist{margin-bottom:12px}
.taglist .trow{grid-template-columns:20px minmax(0,1fr) 28px}
.taglist .del{color:var(--muted);font-size:16px;text-align:center}
.addtag{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.addtag button{padding:0 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.rate-row{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rate-row input{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.how{font-size:14px;margin:0;padding-left:18px}
.how li{margin-bottom:8px}
.err{color:var(--red);font-size:14px;min-height:18px;margin:0 0 8px}
.donut-card{padding:18px 14px 14px;text-align:center}
.donut{display:block;width:220px;max-width:100%;height:auto;margin:0 auto}
.donut .dn-total{fill:var(--text);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.donut-card small{margin-top:10px}
.donut .dn-name{fill:var(--muted);font-size:12px}
.budget{margin:-4px 14px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bbar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bbar div{height:100%;border-radius:99px}
.brow{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.brow input{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.switch{position:relative;flex:none;width:46px;height:28px;border-radius:99px;background:var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{left:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast[hidden]{display:none}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.swatches button{aspect-ratio:1;border-radius:50%;border:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.cat-preview{display:flex;justify-content:center;margin:4px 0 12px}
.ico.xs{width:16px;height:16px;box-shadow:none}
.ico.xs svg{width:9px;height:9px;stroke-width:1.8}
.trk{display:flex;align-items:center;margin:0 12px 9px}
.crow-wrap .trk .track{flex:1;margin:0}
.amt-big{position:relative;display:flex;justify-content:center;margin:10px 0 4px}
.amt-big input{width:180px;text-align:center;font-size:40px;font-weight:600;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0;font-variant-numeric:tabular-nums}
.cur-pill{position:absolute;right:0;top:50%;transform:translateY(-50%);width:auto;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--accent);background:var(--chip);border:0}
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin:16px 0 14px}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.2;padding:2px}
.cat-tile .ico.lg{width:50px;height:50px;transition:box-shadow .15s}
.cat-tile[aria-pressed="true"] .ico.lg{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.ico.lg svg{width:22px;height:22px;stroke-width:1.5}
.daterow{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--chip);font-weight:600;font-size:16px;margin-bottom:12px;cursor:pointer}
.daterow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.rcal{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.rcal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.rcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.rcal-grid .wd{font-size:11px;color:var(--muted);padding-bottom:4px}
.rcal-grid button{min-height:48px;border-radius:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.rcal-grid button[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.rcal-grid .dnum{font-size:14px}
.rcal-grid em{font-style:normal;font-size:10.5px;line-height:1.1}
.rcal-grid em.neg{color:var(--red)}
.rcal-grid em.pos{color:var(--green)}
.rcal-grid button[aria-current="true"] em{color:var(--on-accent)}
.tagfgroup{font-size:13px;color:var(--muted);margin:12px 0 6px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.photos:empty{display:none}
.photos>div{position:relative;aspect-ratio:1;border-radius:10px;background:var(--chip) center/cover no-repeat}
.photos button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:22px;text-align:center}
/* Шестерёнка закреплена отдельно вверху справа; весь экран начинается ниже неё */
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);right:16px;z-index:15;padding:0;background:none}
main{padding-top:calc(env(safe-area-inset-top,0px) + 56px) !important}
.tabs{left:0;right:0;bottom:0;border:0;border-top:1px solid rgba(255,255,255,.08);border-radius:22px 22px 0 0;background:rgba(18,20,26,.72);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);padding:8px max(6px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.tabs button{color:var(--muted);gap:4px;transition:color .2s}
.tabs button span{display:flex;height:22px}
.tabs button small{font-size:10px;letter-spacing:.3px}
.tabs button[aria-current="page"],.tabs button[aria-current="page"] small{color:var(--text)}
.tabs button[aria-current="page"] span{color:var(--accent)}
.tabs .fab{flex:0 0 48px;width:48px;height:48px;margin:0 4px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#8aa3ff,#5b78f0);color:#fff;box-shadow:0 6px 18px rgba(108,140,255,.35)}
.card>.rcal{margin-top:0;border-top:0;padding-top:0}
.periods.three{grid-template-columns:repeat(3,1fr);margin-bottom:10px}
.periods.three button,.periods.two button{padding:9px 0}
.periods.two{grid-template-columns:1fr 1fr;margin-bottom:10px}
.fbar.two{grid-template-columns:1fr 1fr}
.fbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fbtn{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.fbtn small{font-size:11px;color:var(--muted)}
.fbtn[aria-pressed="true"]{color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.fbtn i{font-style:normal;font-size:12px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);text-align:center}
.card,.crow-wrap,.periods{background:rgba(18,20,28,.58);border:1px solid rgba(255,255,255,.07);border-radius:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
</style>
</head>
<body>
<div class="bgl" id="graphite" aria-hidden="true"></div>
<div class="bgl" id="pulse" aria-hidden="true"><b><i class="p-red"></i><i class="p-green"></i></b></div>
<div class="wrap">
  <header>
    <button class="gear" data-act="tab" data-v="settings" aria-label="Настройки" id="gear">⚙️</button>
  </header>

  <main id="view"></main>
</div>

  if (st.mode === 'day') { const [y,m,d] = st.date.split('-').map(Number); return `${d} ${MONTHS_GEN[m-1]} ${y}`; }
  if (st.mode === 'month') { const [y,m] = st.month.split('-').map(Number); return `${MONTHS[m-1].toLowerCase()} ${y}`; }
  if (st.mode === 'year') return `${st.year} год`;
  return 'всё время';
};
function periodBlock(short = false){
  let picker;
  if (st.mode === 'day') {
    const [y,m,d] = st.date.split('-').map(Number);
    picker = `<button class="picker-btn" data-act="openCal">${d} ${MONTHS_GEN[m-1]} ${y} <small>▾</small></button>`;
  } else if (st.mode === 'month') {
    const [y,m] = st.month.split('-').map(Number);
    picker = `<button class="picker-btn" data-act="openSheet" data-v="month">${MONTHS[m-1]} ${y} <small>▾</small></button>`;
  } else if (st.mode === 'year') {
    picker = `<button class="picker-btn" data-act="openSheet" data-v="year">${st.year} <small>▾</small></button>`;
  } else {
    picker = `<span class="picker-static">Вся история</span>`;
  }
  const btn = (v, label) => `<button data-act="mode" data-v="${v}" aria-pressed="${st.mode === v}">${label}</button>`;
  return `<div class="periods${short ? ' short' : ''}" role="group" aria-label="Период">${btn('day','День')}${btn('month','Месяц')}${short ? '' : btn('year','Год') + btn('all','Всё время')}</div>
    <div class="picker">${picker}</div>`;
}

/* ---------- Экраны ---------- */
function sumUsd(list, type){ return list.filter(o => o.type === type).reduce((a,o) => a + o.usd, 0); }
function opRow(o){
  const c = catOf(o.catId);
  const t = tagOf(o.tagId);
  const sign = o.type === 'income' ? '+' : '−';
  const orig = o.cur === 'USD' ? '' : `${fmtNum(o.amount)} ${curOf(o.cur).sym} · `;
  const tag = t ? `<span class="muted" style="font-size:13px"># ${esc(t.name)} · </span>` : '';
  return `<button class="op" data-act="editOp" data-id="${o.id}">
    ${ico(c.icon, '', c.color)}
    <span class="op-main"><b>${esc(c.name)}</b><small>${tag}${o.photos && o.photos.length ? '📷 ' + o.photos.length + ' · ' : ''}${o.note ? esc(o.note) + ' · ' : ''}${orig}${fmtDate(o.date)}</small></span>
    <span class="op-sum ${o.type === 'income' ? 'pos' : 'neg'}">${sign}${usd(o.usd)}</span>
  </button>`;
}

function homeView(list){
  const inc = sumUsd(list, 'income');
  const exp = sumUsd(list, 'expense');
  const bal = inc - exp;
  const top = catRows(list, 'expense', false, true);
  return `${periodBlock(true)}
    <div class="card center balance"><small>Баланс</small><b class="${bal < 0 ? 'neg' : ''}">${bal < 0 ? '−' : ''}${usd0(Math.abs(bal))}</b></div>
    <div class="row2">
      <div class="card"><small>Доходы</small><b class="pos">${usd0(inc)}</b></div>
      <div class="card"><small>Расходы</small><b class="neg">${usd0(exp)}</b></div>
    </div>
    <h3 class="center">На что ушло</h3>
    <div>${top.html}</div>
    ${st.mode === 'month' ? `<div class="card">${repCal(OPS)}</div>` : ''}`;
}

function opsGroups(items){
  const groups = {};
  items.forEach(o => (groups[o.date] = groups[o.date] || []).push(o));
  return Object.keys(groups).sort().reverse().map(d => {
    const g = groups[d];
    const net = sumUsd(g, 'income') - sumUsd(g, 'expense');
    return `<div class="day"><span>${fmtDate(d)}</span><span>${net >= 0 ? '+' : '−'}${usd(Math.abs(net))}</span></div>
      <div class="card list">${g.sort((a,b) => b.id - a.id).map(opRow).join('')}</div>`;
  }).join('');
}
/* Окно с операциями одной категории за выбранный период (с главной) */
function drawCatOps(catId){
  const c = catOf(catId);
  const items = OPS.filter(inPeriod).filter(o => o.catId === catId);
  openSheet(`
    <div class="sheet-head">
      <button class="btn ghost" data-act="closeSheet">Закрыть</button>
      <h2>${esc(c.name)}</h2>
      <span style="width:60px"></span>
    </div>
    <p class="muted center" style="margin:-6px 0 4px">${periodLabel()} · ${usd(items.reduce((a,o) => a + o.usd, 0))}</p>
    ${items.length ? opsGroups(items) : '<p class="muted center">Операций нет</p>'}`);
}

function opsView(list){
  let items = list;
  if (st.opFilter !== 'all') items = items.filter(o => o.type === st.opFilter);
  if (st.opCatF.length) items = items.filter(o => st.opCatF.includes(o.catId));
  if (st.opTagF.length) items = items.filter(o => st.opTagF.includes(o.tagId));
  const seg = (v, l) => `<button data-act="opFilter" data-v="${v}" aria-pressed="${st.opFilter === v}">${l}</button>`;
  const fbtn = (act, label, n) => `<button class="fbtn" data-act="${act}" data-v="ops" aria-pressed="${n > 0}">${label}${n ? ` <i>${n}</i>` : ' <small>▾</small>'}</button>`;
  const chips = `<div class="periods three" role="group" aria-label="Тип">${seg('all','Все')}${seg('expense','Расходы')}${seg('income','Доходы')}</div>
    <div class="fbar">
      ${fbtn('openCatF', 'Категории', st.opCatF.length)}
      ${fbtn('openTagF', 'Теги', st.opTagF.length)}
      <button class="fbtn" data-act="opSort" data-v="${st.opSort === 'date' ? 'amount' : 'date'}">↓ ${st.opSort === 'date' ? 'Дата' : 'Сумма'}</button>
    </div>`;
  let body;
  if (!items.length) body = '<p class="muted center">Операций за этот период нет</p>';
  else if (st.opSort === 'amount') {
    body = `<div class="card list">${items.slice().sort((a,b) => b.usd - a.usd).map(opRow).join('')}</div>`;
  } else {
    body = opsGroups(items);
  }
  return `${periodBlock()}${chips}${body}`;
}

/* Строки категорий с раскрытием: проценты, сумма и теги внутри */
function catRows(list, type, withBudget = false, home = false){
  const total = sumUsd(list, type);
  const byCat = {};
  list.filter(o => o.type === type).forEach(o => {
    const r = byCat[o.catId] = byCat[o.catId] || {total: 0, tags: {}};
    r.total += o.usd;
    const key = o.tagId || 'none';
    r.tags[key] = (r.tags[key] || 0) + o.usd;
  });
  const rows = Object.entries(byCat).map(([id, r]) => ({...catOf(id), ...r})).sort((a,b) => b.total - a.total);
  const html = rows.length ? rows.map(r => {
    const open = !!st.openCats[r.id];
    const b = withBudget && st.mode === 'month' && st.showBudgets ? (st.budgets[st.month] || {})[r.id] : null;
    const bud = b ? budgetStrip(b, r.total) : '';
    const color = catColor(r);
    const tagRows = Object.entries(r.tags).sort((a,b) => b[1] - a[1]).map(([key, sum]) => {
      if (key === 'none') return '';
      const name = tagOf(key).name;
      return `<div class="trow"><span class="hash">#</span><span class="tname">${esc(name)}</span><b class="tsum">${usd(sum)}</b></div>`;
    }).join('');
    return `<div class="crow-wrap">
      <button class="crow${home ? ' home' : ''}" data-act="${home ? 'catOps' : tagRows ? 'toggleCat' : ''}" data-v="${r.id}" aria-expanded="${open}">
        ${ico(r.icon, '', color)}
        <span class="name">${esc(r.name)}</span>
        ${home ? '' : `<span class="pct">${Math.round(r.total / total * 100)}%</span>`}
        <span class="sum">${usd(r.total)}</span>
        ${tagRows ? '' : '<span></span>'}<span class="chev ${open ? 'open' : ''}"${tagRows ? '' : ' hidden'}${home ? ` data-act="toggleCat" data-v="${r.id}"` : ''}>${open ? '▴' : '▾'}</span>
      </button>
      ${bud}
      ${home ? '' : `<div class="trk"><div class="track"><div style="width:${(r.total / total * 100).toFixed(1)}%;background:${color}"></div></div></div>`}
      ${open && tagRows ? `<div class="tagrows">${tagRows}</div>` : ''}
    </div>`;
  }).join('') : '<p class="muted center">Нет данных за этот период</p>';
  return {total, html, data: rows};
}

/* Бюджет на месяц: строка и полоска под категорией в отчёте (цвет: зелёный до 80%, жёлтый до 100%, красный дальше) */
function budgetStrip(b, spent){
  const left = b - spent;
  const pct = spent / b * 100;
  const color = pct < 80 ? 'var(--green)' : pct <= 100 ? '#e0a83a' : 'var(--red)';
  return `<div class="budget">из ${usd(b)} · ${left >= 0 ? 'осталось ' + usd(left) : 'перерасход ' + usd(-left)}
    <div class="bbar"><div style="width:${Math.min(pct, 100).toFixed(0)}%;background:${color}"></div></div></div>`;
}
/* Окно бюджетов на выбранный месяц: можно скопировать значения с прошлого месяца */
function drawBudgets(){
  const [y,m] = st.month.split('-').map(Number);
  const prev = m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`;
  const cur = st.budgets[st.month] || {};
  const rows = CAT.filter(c => c.type === 'expense').map(c => `
    <div class="brow"><span>${esc(c.name)}</span><input type="text" inputmode="decimal" data-bud="${c.id}" value="${cur[c.id] || ''}" placeholder="нет" aria-label="Бюджет ${esc(c.name)}"></div>`).join('');
  openSheet(`
    <div class="sheet-head">
      <button class="btn ghost" data-act="closeSheet">Отмена</button>
      <h2>Бюджеты · ${MONTHS[m-1]} ${y}</h2>
      <button class="btn" data-act="saveBudgets">Готово</button>
    </div>
    <div class="chips"><button class="chip" data-act="copyBudgets" data-v="${prev}">Как в прошлом месяце</button></div>
    ${rows}
    <p class="sub">Пустое поле — бюджета на этот месяц нет. Суммы в долларах.</p>`);
}
function saveBudgets(){
  const out = {};
  document.querySelectorAll('[data-bud]').forEach(i => {
    const v = parseFloat(i.value.replace(',', '.'));
    if (v > 0) out[i.dataset.bud] = v;
  });
  st.budgets[st.month] = out;
  closeSheet(); render();
}
function copyBudgets(el){
  const src = st.budgets[el.dataset.v] || {};
  document.querySelectorAll('[data-bud]').forEach(i => { i.value = src[i.dataset.bud] || ''; });
}

/* Кружок в отчётах: доли категорий и итог в центре */
function donut(data, total){
  const C = 2 * Math.PI * 80;
  let off = 0;
  let badges = '';
  const sel = st.repSel ? data.find(r => r.id === st.repSel) : null;
  const segs = data.map(r => {
    const len = total ? r.total / total * C : 0;
    const dim = sel && sel.id !== r.id;
    const s = `<circle data-act="donutSeg" data-v="${r.id}" cx="100" cy="100" r="80" fill="none" stroke="${catColor(r)}" stroke-width="22" stroke-dasharray="${Math.max(len - 2, 0).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)" opacity="${dim ? .3 : 1}" style="cursor:pointer"/>`;
    if (total && r.total / total >= 0.04) {
      const ang = ((off + len / 2) / C) * 2 * Math.PI - Math.PI / 2;
      const x = 100 + 80 * Math.cos(ang), y = 100 + 80 * Math.sin(ang);
      badges += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" pointer-events="none"><circle r="11" fill="${catColor(r)}" stroke="var(--card)" stroke-width="2"/><svg x="-6.5" y="-6.5" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_SVG[r.icon]}</svg></g>`;
    }
    off += len;
    return s;
  }).join('');
  const center = sel
    ? `<circle cx="100" cy="84" r="26" fill="${catColor(sel)}"/>
       <svg x="86" y="70" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON_SVG[sel.icon]}</svg>
       <text x="100" y="128" text-anchor="middle" class="dn-name">${esc(sel.name)}</text>
       <text x="100" y="146" text-anchor="middle" class="dn-total">${usd(sel.total)}</text>`
    : `<text x="100" y="106" text-anchor="middle" class="dn-total">${usd(total)}</text>`;
  return `<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Доли категорий">
    <circle cx="100" cy="100" r="80" fill="none" stroke="var(--line)" stroke-width="22" opacity=".5"/>
    ${segs}${badges}
    <g data-act="donutSeg" data-v="" style="cursor:pointer">${center}</g>
  </svg>`;
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.hidden = true; }, 2800);
}

/* Календарь месяца в отчёте: в каждом дне расходы (красным) и доходы (зелёным) */
function repCal(list){
  const [y,m] = st.repCal.split('-').map(Number);
  const first = (new Date(y,m-1,1).getDay() + 6) % 7;
  const days = new Date(y,m,0).getDate();
  const sums = {};
  list.forEach(o => {
    const s = sums[o.date] = sums[o.date] || {e: 0, i: 0};
    if (o.type === 'expense') s.e += o.usd; else s.i += o.usd;
  });
  const cells = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => `<span class="wd">${w}</span>`);
  for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`;
    const s = sums[key];
    cells.push(`<button data-act="repDay" data-v="${key}" aria-current="${key === st.date && st.mode === 'day'}"><span class="dnum">${d}</span>${s && s.e ? `<em class="neg">−${Math.round(s.e)} $</em>` : ''}${s && s.i ? `<em class="pos">+${Math.round(s.i)} $</em>` : ''}</button>`);
  }
  return `<div class="rcal">
    <div class="rcal-head"><button class="nav" data-act="repCalStep" data-v="-1" aria-label="Месяц назад">‹</button><span>${MONTHS[m-1]} ${y}</span><button class="nav" data-act="repCalStep" data-v="1" aria-label="Месяц вперёд">›</button></div>
    <div class="rcal-grid">${cells.join('')}</div>
  </div>`;
}

function reportsView(listAll){
  let list = st.tagF.length ? listAll.filter(o => o.tagId && st.tagF.includes(o.tagId)) : listAll;
  if (st.repCatF.length) list = list.filter(o => o.type !== st.repType || st.repCatF.includes(o.catId));
  const rows = catRows(list, st.repType, true);

  const fbtn = (act, label, n) => `<button class="fbtn" data-act="${act}" aria-pressed="${n > 0}">${label}${n ? ` <i>${n}</i>` : ' <small>▾</small>'}</button>`;
  const month = st.mode === 'month';
  return `${periodBlock()}
    <div class="periods two" role="group" aria-label="Тип">${seg('expense','Расходы')}${seg('income','Доходы')}</div>
    <div class="fbar${month ? '' : ' two'}">
      ${fbtn('openCatF', 'Категории', st.repCatF.length)}

    <div class="card donut-card">${donut(rows.data, rows.total)}<small class="center">${st.repType === 'expense' ? 'Всего расходов' : 'Всего доходов'}${st.tagF.length || st.repCatF.length ? ' по фильтру' : ''}</small></div>
    <h3>По категориям</h3>
    ${rows.html}
    <h3>Экспорт</h3>
    <div class="card list">
      <button class="op" data-act="exportPdf"><span class="op-main"><b>Скачать PDF</b><small>Операции и итоги за выбранный период</small></span></button>
      <button class="op" data-act="exportXlsx"><span class="op-main"><b>Скачать Excel (.xlsx)</b><small>Все операции таблицей, удобно для нейросети и своих расчётов</small></span></button>
    </div>
    <p class="muted center" style="font-size:13px">Доходов за период: ${usd(inc)} · Расходов: ${usd(exp)}</p>`;
}

function chartSVG(){
  const ref = st.mode === 'month' ? st.month : st.mode === 'year' ? `${st.year}-12` : st.date.slice(0,7);
  const [ry, rm] = ref.split('-').map(Number);
  const months = [5,4,3,2,1,0].map(k => { const t = new Date(ry, rm - 1 - k, 1); return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; });
  const data = months.map(m => {
    const l = OPS.filter(o => o.date.startsWith(m));
    return {inc: sumUsd(l, 'income'), exp: sumUsd(l, 'expense')};
  });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 320, H = 150, gw = W / 6, bw = gw * 0.3;
  return `<svg viewBox="0 0 ${W} ${H + 22}" class="chart" role="img" aria-label="Доходы и расходы за 6 месяцев, в долларах">${data.map((d,i) => {
    const x = i * gw + gw * 0.15;
    const hi = d.inc / max * H, he = d.exp / max * H;
    return `<rect x="${x}" y="${H - hi}" width="${bw}" height="${hi}" rx="4" fill="var(--green)"/>
      <rect x="${x + bw + 3}" y="${H - he}" width="${bw}" height="${he}" rx="4" fill="var(--red)"/>
      <text x="${x + bw}" y="${H + 16}" text-anchor="middle">${MONTHS[+months[i].slice(5)-1].slice(0,3)}</text>`;
  }).join('')}</svg>`;
}

function catsView(){
  const list = CAT.filter(c => c.type === st.catType);
  const rows = list.map(c => {
    const n = OPS.filter(o => o.catId === c.id).length;

    return `<button class="op" data-act="editCat" data-id="${c.id}">

      <span class="op-edit">✎</span></button>`;
  }).join('');
  return `<div class="chips">
      <button class="chip" data-act="catType" data-v="expense" aria-pressed="${st.catType === 'expense'}">Расходы</button>

}

  const bal = Math.round((sumUsd(list, 'income') - sumUsd(list, 'expense')) * 100);

  const views = {
    home: () => homeView(list),
    ops: () => opsView(list),
    reports: () => reportsView(list),

/* ---------- Фото: хранятся на телефоне (IndexedDB), сжимаются при добавлении ---------- */
const PH_DB = 'finance-photos';
function phOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(PH_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function phPut(id, blob){
  const db = await phOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('p', 'readwrite');
    tx.objectStore('p').put(blob, id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function phGet(id){
  const db = await phOpen();
  return new Promise((res, rej) => {
    const q = db.transaction('p').objectStore('p').get(id);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => rej(q.error);
  });
}
async function phDel(id){
  const db = await phOpen();
  db.transaction('p', 'readwrite').objectStore('p').delete(id);
}
async function phStats(){
  const db = await phOpen();
  return new Promise(res => {
    let n = 0, bytes = 0;
    const c = db.transaction('p').objectStore('p').openCursor();
    c.onsuccess = () => {
      const cur = c.result;
      if (cur) { n++; bytes += cur.value.size || 0; cur.continue(); }
      else res({n, bytes});
    };
  });
}
/* Фото без операции (после отмены или сбоя) удаляем при запуске */
async function phCleanup(){
  const used = new Set(OPS.flatMap(o => o.photos || []).concat(st.draftPhotos));
  const db = await phOpen();
  const keys = await new Promise(res => {
    const q = db.transaction('p').objectStore('p').getAllKeys();
    q.onsuccess = () => res(q.result);
  });
  keys.filter(k => !used.has(k)).forEach(phDel);
}
/* Длинная сторона до 1280 px, JPEG 70%: примерно 150–250 КБ на фото */
async function compressPhoto(file){
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k);
  c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .7));
}
async function addFiles(input){
  for (const f of input.files) {
    const blob = await compressPhoto(f);
    const id = 'ph' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    await phPut(id, blob);
    st.draftPhotos.push(id);
  }
  input.value = '';
  renderPhotos();
}
async function renderPhotos(){
  const box = document.getElementById('f-photos');
  if (!box) return;
  const urls = await Promise.all(st.draftPhotos.map(async id => {
    const b = await phGet(id);
    return b ? URL.createObjectURL(b) : '';
  }));
  box.innerHTML = urls.map((u, i) => `<div style="background-image:url('${u}')"><button data-act="delPhoto" data-v="${i}" aria-label="Удалить фото">✕</button></div>`).join('');
}
function delPhoto(el){ st.draftPhotos.splice(Number(el.dataset.v), 1); renderPhotos(); }
function cancelOp(){
  const orig = st.editOp ? (OPS.find(o => o.id === st.editOp)?.photos || []) : [];
  st.draftPhotos.filter(id => !orig.includes(id)).forEach(phDel);
  st.draftPhotos = [];
  closeSheet();
}

/* ---------- Курсы: обновляются, когда есть интернет; без сети остаются последние ---------- */
let RATES_DATE = null;
async function refreshRates(){
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const d = await res.json();
    if (d.result !== 'success') return;
    CUR.forEach(c => { const v = d.rates[c.code]; if (c.code !== 'USD' && v) c.rate = +(1 / v).toFixed(6); });
    RATES_DATE = d.time_last_update_utc;
    render();
  } catch (e) { /* нет связи: работаем по последним курсам */ }
}

/* ---------- Файлы: download, Excel (.xlsx) и PDF через печать ---------- */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* Минимальный zip без сжатия: достаточно для .xlsx */
function zipFiles(files, mime){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true);
    ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type: mime});
}
function xlsxBlob(header, rows, numCols){
  const L = 'ABCDEFGHIJ';
  const cell = (v, ref, num) => typeof v === 'number' && num
    ? `<c r="${ref}"><v>${v}</v></c>`
    : `<c r="${ref}" t="inlineStr"><is><t>${esc(String(v ?? ''))}</t></is></c>`;
  const all = [header, ...rows];
  const sheetRows = all.map((r, i) => `<row r="${i + 1}">${r.map((v, j) => cell(v, L[j] + (i + 1), numCols.includes(j))).join('')}</row>`).join('');
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const enc = s => new TextEncoder().encode(s);
  return zipFiles([
    {name: '[Content_Types].xml', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`)},
    {name: '_rels/.rels', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RS}/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
    {name: 'xl/workbook.xml', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${RS}"><sheets><sheet name="Операции" sheetId="1" r:id="rId1"/></sheets></workbook>`)},
    {name: 'xl/_rels/workbook.xml.rels', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RS}/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`)},
    {name: 'xl/worksheets/sheet1.xml', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetData>${sheetRows}</sheetData></worksheet>`)}
  ], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function printHtml(html){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  document.body.appendChild(f);
  f.onload = () => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60000); };
  f.srcdoc = html;
}
function exportRows(){
  return OPS.filter(inPeriod).slice().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
}
function exportReport(kind){
  const list = exportRows();
  const inc = sumUsd(list, 'income'), exp = sumUsd(list, 'expense');
  const label = periodLabel();
  const fileBase = `Финансы_${label.replace(/\s+/g, '_')}`;
  const sign = o => o.type === 'income' ? '+' : '−';
  if (kind === 'xlsx') {
    const header = ['Дата', 'Тип', 'Категория', 'Тег', 'Сумма, $', 'Сумма в валюте', 'Валюта', 'Заметка', 'Фото'];
    const rows = list.map(o => [fmtDate(o.date), o.type === 'income' ? 'Доход' : 'Расход', catOf(o.catId).name,
      tagOf(o.tagId)?.name || '', o.usd, o.amount, o.cur, o.note || '', (o.photos || []).length]);
    download(xlsxBlob(header, rows, [4, 5, 8]), fileBase + '.xlsx');
    return;
  }
  const trs = list.map(o => `<tr><td>${fmtDate(o.date)}</td><td>${esc(catOf(o.catId).name)}</td><td>${esc(tagOf(o.tagId)?.name || '')}</td><td>${esc(o.note || '')}</td><td class="n">${sign(o)}${usd(o.usd)}</td><td class="n">${o.cur === 'USD' ? '' : fmtNum(o.amount) + ' ' + curOf(o.cur).sym}</td></tr>`).join('');
  printHtml(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(fileBase)}</title><style>
    body{font:12px -apple-system,system-ui,sans-serif;color:#111;margin:20px}
    h1{font-size:18px;margin:0 0 4px} .sub{color:#555;margin:0 0 14px}
    .tot{display:flex;gap:28px;margin-bottom:16px} .tot b{display:block;font-size:15px}
    table{width:100%;border-collapse:collapse} th,td{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
    th{font-size:11px;color:#555} td.n,th.n{text-align:right;white-space:nowrap}
    @page{size:A4;margin:14mm}
  </style></head><body>
    <h1>Финансы: ${esc(label)}</h1><p class="sub">Все суммы в долларах</p>
    <div class="tot"><div>Доходы<b>${usd(inc)}</b></div><div>Расходы<b>${usd(exp)}</b></div><div>Баланс<b>${usd(inc - exp)}</b></div></div>
    <table><thead><tr><th>Дата</th><th>Категория</th><th>Тег</th><th>Заметка</th><th class="n">Сумма, $</th><th class="n">В валюте</th></tr></thead>
    <tbody>${trs}</tbody></table>
  </body></html>`);
}
function backupJson(){
  const data = {CAT, TAGS, CUR, OPS, budgets: st.budgets, showBudgets: st.showBudgets};
  download(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}), `finance-backup-${new Date().toISOString().slice(0, 10)}.json`);
}
function restoreJson(f){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.CAT) || !Array.isArray(d.OPS)) throw new Error('bad');
      CAT = d.CAT; TAGS = d.TAGS || []; CUR = d.CUR || CUR; OPS = d.OPS;
      st.budgets = d.budgets || {}; st.showBudgets = d.showBudgets !== false;
      render();
      alert('Данные загружены. Фото из резервной копии не входят: они хранятся только на том телефоне, где были добавлены.');
    } catch (e) { alert('Этот файл не похож на резервную копию'); }
  };
  r.readAsText(f);
}

/* ---------- Нажатия и ввод ---------- */
const H = {
  tab(el){ st.view = el.dataset.v; render(); window.scrollTo(0,0); },
  mode(el){
    st.mode = el.dataset.v;
    if (st.mode === 'month') st.month = st.date.slice(0,7);
    if (st.mode === 'year') st.year = +st.date.slice(0,4);
    render();
  },
  openCal(){ st.calMonth = st.date.slice(0,7); drawCal(); },
  calStep(el){
    const [y,m] = st.calMonth.split('-').map(Number);
    const t = new Date(y, m - 1 + Number(el.dataset.v), 1);
    st.calMonth = `${t.getFullYear()}-${pad(t.getMonth()+1)}`;
    drawCal();
  },
  pickDay(el){ st.date = el.dataset.v; closeSheet(); render(); },
  openSheet(el){ if (el.dataset.v === 'month') { st.pickYear = +st.month.slice(0,4); drawMonthSheet(); } else drawYearSheet(); },
  yearStep(el){ st.pickYear += Number(el.dataset.v); drawMonthSheet(); },
  pickMonth(el){ st.month = el.dataset.v; st.date = st.month + '-01'; closeSheet(); render(); },
  pickYear(el){ st.year = Number(el.dataset.v); closeSheet(); render(); },
  opFilter(el){ st.opFilter = el.dataset.v; render(); },
  opSort(el){ st.opSort = el.dataset.v; render(); },
  repType(el){ st.repCatF = []; st.repType = el.dataset.v; render(); },
  catOps(el){ drawCatOps(el.dataset.v); },
  toggleCat(el){ st.openCats[el.dataset.v] = !st.openCats[el.dataset.v]; render(); },
  openCatF(el){ st.catFTarget = el.dataset.v || 'reports'; drawCatFilter(); },
  toggleCatF(el){
    const id = el.dataset.v;
    const arr = catFArr();
    const next = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
    if (st.catFTarget === 'ops') st.opCatF = next; else st.repCatF = next;
    el.setAttribute('aria-pressed', String(next.includes(id)));
  },
  clearCatF(){ if (st.catFTarget === 'ops') st.opCatF = []; else st.repCatF = []; drawCatFilter(); },
  openTagF(el){ st.tagFTarget = el.dataset.v || 'reports'; drawTagFilter(); },
  toggleTagF(el){
    const id = el.dataset.v;
    const arr = tagFArr();
    const next = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
    if (st.tagFTarget === 'ops') st.opTagF = next; else st.tagF = next;
    el.setAttribute('aria-pressed', String(next.includes(id)));
  },
  clearTagF(){ if (st.tagFTarget === 'ops') st.opTagF = []; else st.tagF = []; drawTagFilter(); },
  closeTagF(){ closeSheet(); render(); },
  catType(el){ st.catType = el.dataset.v; render(); },
  addOp(){ st.draftType = 'expense'; st.draftCur = 'USD'; drawOp(null); },
  editOp(el){ drawOp(Number(el.dataset.id)); },
  draftType(el){ draftTypeSwitch(el.dataset.v); },
  pickCat(el){
    document.getElementById('f-cat').value = el.dataset.v;
    st.draftTag = null;
    document.querySelectorAll('.cat-tile[data-act="pickCat"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === el.dataset.v)));
    renderTagChips();
  },
  pickTag(el){
    st.draftTag = el.dataset.v && st.draftTag !== el.dataset.v ? el.dataset.v : null;
    renderTagChips();
  },
  saveOp, delOp, delPhoto,
  openBudgets(){ drawBudgets(); },
  copyBudgets, saveBudgets,
  toggleBud(){ st.showBudgets = !st.showBudgets; render(); },
  togglePulse(){ pulseOn = !pulseOn; try { localStorage.setItem('finance-pulse', pulseOn ? 'on' : 'off'); } catch (e) {} render(); },
  donutSeg(el){ const id = el.dataset.v; st.repSel = !id || st.repSel === id ? null : id; render(); },
  repCalStep(el){
    const [y,m] = st.repCal.split('-').map(Number);
    const t = new Date(y, m - 1 + Number(el.dataset.v), 1);
    st.repCal = `${t.getFullYear()}-${pad(t.getMonth()+1)}`;
    render();
  },
  repDay(el){ st.date = el.dataset.v; st.mode = 'day'; render(); },
  addCat(){ drawCat(null); },
  editCat(el){ drawCat(el.dataset.id); },
  pickIcon, pickColor, addTag, delTag, saveCat, askDelCat, confirmDelCat,
  addCur(){ drawCurSheet(); },
  saveCur,
  exportPdf(){ exportReport('pdf'); },
  exportXlsx(){ exportReport('xlsx'); },
  backup(){ backupJson(); },
  reset(){
    if (!confirm('Удалить все операции, бюджеты и фото? Категории и теги останутся.')) return;
    OPS = []; st.budgets = {};
    saveState(); phCleanup(); render();
  },
  cancelOp,
  closeSheet
};
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (el && H[el.dataset.act]) H[el.dataset.act](el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-amount') updateHint();
});
document.addEventListener('change', e => {
  if (e.target.id === 'imp' && e.target.files[0]) restoreJson(e.target.files[0]);
  if (e.target.id === 'f-cur') updateHint();
  if (e.target.id === 'f-files') addFiles(e.target);
  if (e.target.id === 'f-date') updateDateLabel();
  if (e.target.id === 'f-cat') { st.draftTag = null; renderTagChips(); }
  if (e.target.dataset.rate) {
    const c = CUR.find(x => x.code === e.target.dataset.rate);
    const v = parseFloat(e.target.value.replace(',', '.'));
    if (c && v > 0) c.rate = v;
    render();
  }
});

/* ---------- Сохранение на телефоне ----------
   При первом запуске данных ещё нет: приложение берёт примеры и данные из Excel (см. выше).
   После этого хранятся только ваши изменения. */
const STORE_KEY = 'finance-app-v2';
function saveState(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({CAT, TAGS, CUR, OPS, budgets: st.budgets, showBudgets: st.showBudgets, idc, ratesDate: RATES_DATE}));
  } catch (e) { /* места нет: данные останутся до закрытия приложения */ }
}
function loadState(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (!d) return;
  CAT = d.CAT; TAGS = d.TAGS; CUR = d.CUR; OPS = d.OPS;
  st.budgets = d.budgets; st.showBudgets = d.showBudgets; RATES_DATE = d.ratesDate || null;
  idc = Math.max(idc, d.idc || 0, ...OPS.map(o => o.id).filter(n => typeof n === 'number'));
}
loadState();

/* «Пульс баланса»: по умолчанию выключен, выбор хранится на телефоне */
let pulseOn = false;
try { pulseOn = localStorage.getItem('finance-pulse') === 'on'; } catch (e) {}
render();
phCleanup();
refreshRates();

/* Новая версия: при открытии сверяем номер с сайтом. Телефон держит старую страницу до 10 минут,
   поэтому при расхождении открываем адрес с номером версии — он загружается заново. Без интернета ничего не делаем. */
fetch('index.html?check=' + Date.now(), {cache: 'no-store'})
  .then(r => r.text())
  .then(t => {
    const m = t.match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION) return;
    if (sessionStorage.getItem('finance-upd') === m[1]) return;  // уже пробовали — не крутимся по кругу
    sessionStorage.setItem('finance-upd', m[1]);
    location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
  })
  .catch(() => {});

/* Офлайн-режим: служебный файл sw.js сохраняет приложение в памяти телефона */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
